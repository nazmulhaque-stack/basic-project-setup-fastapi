# ─────────────────────────────────────────────────────────────────────────────
# Linux kernel tuning for 100 000 (1 lakh) concurrent TCP connections
#
# Apply with:
#   sudo sysctl -p /path/to/sysctl.conf
# Or copy to /etc/sysctl.d/99-highperf.conf for persistence across reboots.
# ─────────────────────────────────────────────────────────────────────────────

# ── TCP listen backlog ────────────────────────────────────────────────────────
# Maximum number of connections in the SYN backlog queue per socket
net.ipv4.tcp_max_syn_backlog = 65535
# Maximum number of sockets in the LISTEN state waiting to be accepted
net.core.somaxconn = 65535

# ── TIME_WAIT socket reuse & cleanup ─────────────────────────────────────────
# Allow reuse of TIME_WAIT sockets for new outgoing connections
net.ipv4.tcp_tw_reuse = 1
# Reduce FIN_WAIT2 timeout (seconds) to free sockets faster
net.ipv4.tcp_fin_timeout = 15

# ── Network device queue ──────────────────────────────────────────────────────
# Maximum number of packets queued on the INPUT side of each NIC
net.core.netdev_max_backlog = 65535

# ── Ephemeral port range ──────────────────────────────────────────────────────
# Extends the range of outbound ports to support high connection churn
net.ipv4.ip_local_port_range = 1024 65535

# ── File descriptor limits ────────────────────────────────────────────────────
# System-wide maximum number of open file descriptors (each socket = 1 fd)
fs.file-max = 2097152

# ── Swap pressure ─────────────────────────────────────────────────────────────
# Prefer keeping data in RAM; only swap under extreme memory pressure
vm.swappiness = 10

# ── TCP keep-alive ────────────────────────────────────────────────────────────
# Idle time (seconds) before the kernel starts sending keep-alive probes
net.ipv4.tcp_keepalive_time = 300
# Number of unanswered probes before the connection is considered dead
net.ipv4.tcp_keepalive_probes = 5
# Interval (seconds) between individual keep-alive probes
net.ipv4.tcp_keepalive_intvl = 15
