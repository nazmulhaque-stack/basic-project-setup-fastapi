# Linux Kernel Sysctl Tuning for 100,000+ Concurrent TCP Connections
# Place in /etc/sysctl.d/99-high-concurrency.conf and run `sysctl -p /etc/sysctl.d/99-high-concurrency.conf`

# ------------------------------------------------------------------------------
# 1. Socket Listen Backlog & Queue Capacity
# ------------------------------------------------------------------------------
# Maximum number of pending connections queued in listen() state
net.core.somaxconn = 65535

# Maximum number of remembered connection requests which have not received ACK from client (SYN floods defense)
net.ipv4.tcp_max_syn_backlog = 65535

# Maximum number of packets queued on the input side when the interface receives packets faster than kernel can process
net.core.netdev_max_backlog = 65535

# ------------------------------------------------------------------------------
# 2. Ephemeral Port Range & Socket Lifecycle Management
# ------------------------------------------------------------------------------
# Expand local ephemeral port range to maximize outbound reverse proxy connections
net.ipv4.ip_local_port_range = 1024 65535

# Allow reuse of TIME_WAIT sockets for new connections when safe from protocol viewpoint
net.ipv4.tcp_tw_reuse = 1

# Reduce time an orphaned socket remains in FIN-WAIT-2 state before being reclaimed (default 60s -> 15s)
net.ipv4.tcp_fin_timeout = 15

# Disable slow start after idle to maintain high TCP window throughput across keepalive bursts
net.ipv4.tcp_slow_start_after_idle = 0

# Maximum number of sockets in TIME_WAIT state allowed simultaneously
net.ipv4.tcp_max_tw_buckets = 2000000

# ------------------------------------------------------------------------------
# 3. Memory & Buffer Optimization (TCP Read/Write Windows)
# ------------------------------------------------------------------------------
# Total TCP memory available in pages: min, default, max
net.ipv4.tcp_mem = 786432 1048576 26777216

# Socket receive buffer sizes (min, default, max bytes)
net.ipv4.tcp_rmem = 4096 87380 16777216
net.core.rmem_max = 16777216
net.core.rmem_default = 262144

# Socket send buffer sizes (min, default, max bytes)
net.ipv4.tcp_wmem = 4096 65536 16777216
net.core.wmem_max = 16777216
net.core.wmem_default = 262144

# ------------------------------------------------------------------------------
# 4. File Descriptor & Virtual Memory Limits
# ------------------------------------------------------------------------------
# Maximum file descriptors across entire operating system
fs.file-max = 2097152

# Virtual memory max map count (essential for high thread count and Redis memory mapping)
vm.max_map_count = 262144
vm.overcommit_memory = 1
