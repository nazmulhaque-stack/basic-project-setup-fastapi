# ─────────────────────────────────────────────────────────────────────────────
# Prometheus scrape configuration
# Scrape interval: 15 s across all jobs
# ─────────────────────────────────────────────────────────────────────────────
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: development

# ── Alerting (placeholder — wire up Alertmanager here when needed) ───────────
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ["alertmanager:9093"]

# ── Rule files (add recording / alerting rules as needed) ───────────────────
# rule_files:
#   - "rules/*.yml"

# ── Scrape jobs ──────────────────────────────────────────────────────────────
scrape_configs:

  # FastAPI application — exposes /metrics via prometheus-fastapi-instrumentator
  - job_name: fastapi
    metrics_path: /metrics
    static_configs:
      - targets:
          - app:8000

  # PgBouncer exporter (prometheuscommunity/pgbouncer-exporter), deployed as
  # its own `pgbouncer-exporter` container in deploy/docker-compose.yml —
  # listens on :9127 by default
  - job_name: postgres
    static_configs:
      - targets:
          - pgbouncer-exporter:9127

  # Redis exporter (oliver006/redis_exporter), deployed as its own
  # `redis-exporter` container pointed at the single `redis` service —
  # listens on :9121 by default
  - job_name: redis
    static_configs:
      - targets:
          - redis-exporter:9121

  # Elasticsearch exporter (prometheuscommunity/elasticsearch-exporter),
  # deployed as its own `elasticsearch-exporter` container — listens on
  # :9114 by default
  - job_name: elasticsearch
    static_configs:
      - targets:
          - elasticsearch-exporter:9114
