; ==============================================================================
; PgBouncer Configuration: 100,000 (1 Lakh) Concurrent Connections Tuning
; ==============================================================================

[databases]
app_db = host=postgres port=5432 dbname=app_db auth_user=postgres

[pgbouncer]
logfile = /var/log/pgbouncer/pgbouncer.log
pidfile = /var/run/pgbouncer/pgbouncer.pid

listen_addr = 0.0.0.0
listen_port = 5432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
admin_users = postgres
stats_users = postgres

; ------------------------------------------------------------------------------
; Connection Pooling (Transaction Mode for Massive Concurrency)
; ------------------------------------------------------------------------------
; Transaction pooling allows 100,000 clients to share 80-100 real backend connections
pool_mode = transaction
max_client_conn = 100000
default_pool_size = 80
min_pool_size = 10
reserve_pool_size = 20
reserve_pool_timeout = 3
max_db_connections = 180

; ------------------------------------------------------------------------------
; Timeouts & Lifecycles
; ------------------------------------------------------------------------------
server_round_robin = 1
server_reset_query = DISCARD ALL
server_idle_timeout = 600
server_lifetime = 3600
client_idle_timeout = 0
client_login_timeout = 60
query_timeout = 120
query_wait_timeout = 120

; ------------------------------------------------------------------------------
; Asyncpg / Prepared Statement Compatibility
; ------------------------------------------------------------------------------
; Ignores startup parameters passed by asyncpg
ignore_startup_parameters = extra_float_digits,statement_cache_size,prepared_statement_cache_size
