services:
    # ----------------------------------------------------------------------------
    # PostgreSQL 16 Relational Database Engine
    # ----------------------------------------------------------------------------
    postgres:
        image: postgres:16-alpine
        container_name: demo_postgres
        restart: unless-stopped
        env_file:
            - ../.env
        environment:
            POSTGRES_DB: ${DB_NAME:-app_db}
            POSTGRES_USER: ${DB_USER:-postgres}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-postgrespassword}
            PGDATA: /var/lib/postgresql/data/pgdata
        command: >
            postgres
            -c max_connections=200
            -c shared_buffers=512MB
            -c effective_cache_size=1536MB
            -c maintenance_work_mem=128MB
            -c checkpoint_completion_target=0.9
            -c wal_buffers=16MB
            -c default_statistics_target=100
            -c random_page_cost=1.1
            -c effective_io_concurrency=200
            -c work_mem=4MB
            -c min_wal_size=1GB
            -c max_wal_size=4GB
        volumes:
            - pgdata:/var/lib/postgresql/data
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-app_db}",
                ]
            interval: 5s
            timeout: 5s
            retries: 5
        ports:
            - "${POSTGRES_PORT:-5432}:5432"
        networks:
            - internal_net

    # ----------------------------------------------------------------------------
    # PgBouncer 1.21+ Transaction Pooling Layer
    # ----------------------------------------------------------------------------
    pgbouncer:
        image: edoburu/pgbouncer:1.21.0-p2
        container_name: demo_pgbouncer
        restart: unless-stopped
        environment:
            DB_USER: ${DB_USER:-postgres}
            DB_PASSWORD: ${DB_PASSWORD:-postgrespassword}
            AUTH_TYPE: scram-sha-256
            DB_HOST: postgres
            DB_PORT: 5432
            DB_NAME: ${DB_NAME:-app_db}
            POOL_MODE: transaction
            MAX_CLIENT_CONN: 100000
            DEFAULT_POOL_SIZE: 80
            MIN_POOL_SIZE: 10
            RESERVE_POOL_SIZE: 10
            RESERVE_POOL_TIMEOUT: 5
            SERVER_LIFETIME: 3600
            SERVER_IDLE_TIMEOUT: 600
            CLIENT_IDLE_TIMEOUT: 300
        ports:
            - "${PGBOUNCER_PORT:-6432}:5432"
        depends_on:
            postgres:
                condition: service_healthy
        networks:
            - internal_net

    # ----------------------------------------------------------------------------
    # Redis 7 — single standalone instance (no cluster)
    # ----------------------------------------------------------------------------
    redis:
        image: redis:7-alpine
        container_name: demo_redis
        restart: unless-stopped
        command:
            [
                "redis-server",
                "--port",
                "6379",
                "--requirepass",
                "${REDIS_PASSWORD:-}",
                "--appendonly",
                "yes",
            ]
        ports:
            - "${REDIS_PORT:-6379}:6379"
        volumes:
            - redisdata:/data
        healthcheck:
            test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-}", "--no-auth-warning", "ping"]
            interval: 2s
            timeout: 2s
            retries: 15
        networks:
            - internal_net

    # ----------------------------------------------------------------------------
    # Elasticsearch 8 CQRS Search Offloading Engine
    # ----------------------------------------------------------------------------
    elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
        container_name: demo_elasticsearch
        restart: unless-stopped
        environment:
            - discovery.type=single-node
            - xpack.security.enabled=${ELASTICSEARCH_SECURITY_ENABLED:-false}
            - ELASTIC_PASSWORD=${ELASTICSEARCH_PASSWORD:-}
            - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
        ports:
            - "${ELASTICSEARCH_PORT:-9200}:9200"
        healthcheck:
            test: ["CMD-SHELL", "curl -s -f http://localhost:9200/_cluster/health || exit 1"]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 30s
        volumes:
            - esdata:/usr/share/elasticsearch/data
        networks:
            - internal_net

    # ----------------------------------------------------------------------------
    # FastAPI Stateless Application Server (Gunicorn + UvicornWorker)
    # ----------------------------------------------------------------------------
    app:
        build:
            context: ..
            dockerfile: deploy/Dockerfile
        container_name: demo_app
        restart: unless-stopped
        env_file:
            - ../.env
        environment:
            DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgrespassword}@pgbouncer:5432/${DB_NAME:-app_db}
            DB_HOST: pgbouncer
            DB_PORT: 5432
            REDIS_URL: redis://default:${REDIS_PASSWORD:-}@redis:6379/0
            REDIS_PASSWORD: ${REDIS_PASSWORD:-}
            ELASTICSEARCH_URL: ${DOCKER_ELASTICSEARCH_URL:-http://elasticsearch:9200}
            ELASTICSEARCH_USERNAME: ${ELASTICSEARCH_USERNAME:-elastic}
            ELASTICSEARCH_PASSWORD: ${ELASTICSEARCH_PASSWORD:-elasticpassword}
            PGBOUNCER_ENABLED: "true"
            WEB_CONCURRENCY: ${WEB_CONCURRENCY:-4}
            GUNICORN_BIND: 0.0.0.0:8000
            OUTBOX_POLL_INTERVAL: ${OUTBOX_POLL_INTERVAL:-1.0}
            OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-100}
            ES_SYNC_POLL_INTERVAL: ${ES_SYNC_POLL_INTERVAL:-1.0}
            ES_SYNC_BATCH_SIZE: ${ES_SYNC_BATCH_SIZE:-100}
            ES_SYNC_MAX_ATTEMPTS: ${ES_SYNC_MAX_ATTEMPTS:-10}
            GUNICORN_RELOAD: "true"
        volumes:
            - ../app:/app/app
            - ../scripts:/app/scripts
            - ../tests:/app/tests
            - ./gunicorn.conf.py:/app/deploy/gunicorn.conf.py:ro
        ports:
            - "${APP_PORT:-8000}:8000"
        depends_on:
            pgbouncer:
                condition: service_started
            redis:
                condition: service_healthy
            elasticsearch:
                condition: service_started
        networks:
            - internal_net

    # ----------------------------------------------------------------------------
    # Nginx Reverse Proxy (First-Line Rate Limiter & Upstream Connection Pooler)
    # ----------------------------------------------------------------------------
    nginx:
        image: nginx:1.25-alpine
        container_name: demo_nginx
        restart: unless-stopped
        ports:
            - "${NGINX_PORT:-80}:80"
        volumes:
            - ./nginx.conf:/etc/nginx/nginx.conf:ro
        depends_on:
            - app
        networks:
            - internal_net

networks:
    internal_net:
        driver: bridge

volumes:
    pgdata:
    redisdata:
    esdata:
