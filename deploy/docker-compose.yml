version: "3.9"

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL 16 Relational Database Engine
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: demo_postgres
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      POSTGRES_DB: ${DB_NAME:-app_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgrespassword}
      PGDATA: /var/lib/postgresql/data/pgdata
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=512MB
      -c effective_cache_size=1536MB
      -c maintenance_work_mem=128MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=4MB
      -c min_wal_size=1GB
      -c max_wal_size=4GB
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-app_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - internal_net

  # ----------------------------------------------------------------------------
  # PgBouncer 1.21+ Transaction Pooling Layer
  # ----------------------------------------------------------------------------
  pgbouncer:
    image: edoburu/pgbouncer:1.21.0-p2
    container_name: demo_pgbouncer
    restart: unless-stopped
    environment:
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgrespassword}
      AUTH_TYPE: scram-sha-256
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-app_db}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 100000
      DEFAULT_POOL_SIZE: 80
      MIN_POOL_SIZE: 10
      RESERVE_POOL_SIZE: 10
      RESERVE_POOL_TIMEOUT: 5
      SERVER_LIFETIME: 3600
      SERVER_IDLE_TIMEOUT: 600
      CLIENT_IDLE_TIMEOUT: 300
    ports:
      - "${PGBOUNCER_PORT:-6432}:5432"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal_net

  # ----------------------------------------------------------------------------
  # Apply database schema migrations before starting the API
  # ----------------------------------------------------------------------------
  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["alembic", "upgrade", "head"]
    env_file:
      - ../.env
    environment:
      MIGRATION_DATABASE_URL: postgresql+asyncpg://${DB_USER:-postgres}:${DB_PASSWORD:-postgrespassword}@postgres:5432/${DB_NAME:-app_db}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal_net

  # ----------------------------------------------------------------------------
  # Apache Kafka single-node KRaft broker (local development)
  # ----------------------------------------------------------------------------
  kafka:
    image: apache/kafka:3.9.1
    container_name: demo_kafka
    restart: unless-stopped
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    volumes:
      - kafkadata:/var/lib/kafka/data
    networks:
      - internal_net

  # ----------------------------------------------------------------------------
  # Redis 7 Cluster (3 Master Nodes across Ports 7000, 7001, 7002)
  # ----------------------------------------------------------------------------
  redis-1:
    image: redis:7-alpine
    container_name: demo_redis_1
    restart: unless-stopped
    command: ["redis-server", "--port", "7000", "--cluster-enabled", "yes", "--cluster-config-file", "nodes.conf", "--cluster-node-timeout", "5000", "--cluster-announce-hostname", "redis-1", "--cluster-preferred-endpoint-type", "hostname", "--appendonly", "yes", "--protected-mode", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "7000", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15
    networks:
      - internal_net

  redis-2:
    image: redis:7-alpine
    container_name: demo_redis_2
    restart: unless-stopped
    command: ["redis-server", "--port", "7001", "--cluster-enabled", "yes", "--cluster-config-file", "nodes.conf", "--cluster-node-timeout", "5000", "--cluster-announce-hostname", "redis-2", "--cluster-preferred-endpoint-type", "hostname", "--appendonly", "yes", "--protected-mode", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "7001", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15
    networks:
      - internal_net

  redis-3:
    image: redis:7-alpine
    container_name: demo_redis_3
    restart: unless-stopped
    command: ["redis-server", "--port", "7002", "--cluster-enabled", "yes", "--cluster-config-file", "nodes.conf", "--cluster-node-timeout", "5000", "--cluster-announce-hostname", "redis-3", "--cluster-preferred-endpoint-type", "hostname", "--appendonly", "yes", "--protected-mode", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "7002", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15
    networks:
      - internal_net

  redis-cluster-init:
    image: redis:7-alpine
    container_name: demo_redis_cluster_init
    depends_on:
      redis-1:
        condition: service_healthy
      redis-2:
        condition: service_healthy
      redis-3:
        condition: service_healthy
    networks:
      - internal_net
    entrypoint: >
      /bin/sh -c "
      set -eu;
      for node in 'redis-1 7000' 'redis-2 7001' 'redis-3 7002'; do
        set -- $$node;
        attempt=0;
        until redis-cli -h \"$$1\" -p \"$$2\" ping >/dev/null 2>&1; do
          attempt=$$((attempt + 1));
          if [ \"$$attempt\" -ge 30 ]; then
            echo \"Redis node $$1:$$2 is unreachable after 30 seconds; refusing to inspect or reset cluster state.\" >&2;
            exit 1;
          fi;
          sleep 1;
        done;
      done;
      all_ok=1;
      for node in 'redis-1 7000' 'redis-2 7001' 'redis-3 7002'; do
        set -- $$node;
        state=$$(redis-cli -h \"$$1\" -p \"$$2\" cluster info | sed -n 's/^cluster_state://p' | tr -d '\\r');
        if [ \"$$state\" != 'ok' ]; then all_ok=0; fi;
      done;
      if [ \"$$all_ok\" = '1' ]; then
        echo 'Redis Cluster is already initialized and healthy.';
        exit 0;
      fi;
      fresh=1;
      for node in 'redis-1 7000' 'redis-2 7001' 'redis-3 7002'; do
        set -- $$node;
        info=$$(redis-cli -h \"$$1\" -p \"$$2\" cluster info);
        known=$$(printf '%s\\n' \"$$info\" | sed -n 's/^cluster_known_nodes://p' | tr -d '\\r');
        assigned=$$(printf '%s\\n' \"$$info\" | sed -n 's/^cluster_slots_assigned://p' | tr -d '\\r');
        if [ \"$$known\" != '1' ] || [ \"$$assigned\" != '0' ]; then fresh=0; fi;
      done;
      if [ \"$$fresh\" = '1' ]; then
        echo 'Creating a new Redis Cluster.';
        echo 'yes' | redis-cli --cluster create redis-1:7000 redis-2:7001 redis-3:7002 --cluster-replicas 0;
      else
        echo 'Existing Redis cluster metadata detected; refreshing known peer addresses.';
        for node in 'redis-1 7000' 'redis-2 7001' 'redis-3 7002'; do
          set -- $$node;
          source_service=$$1;
          source_port=$$2;
          source_nodes=$$(redis-cli -h \"$$source_service\" -p \"$$source_port\" cluster nodes);
          for peer in 'redis-1 7000' 'redis-2 7001' 'redis-3 7002'; do
            set -- $$peer;
            target_service=$$1;
            target_port=$$2;
            if [ \"$$target_service\" != \"$$source_service\" ]; then
              target_id=$$(redis-cli -h \"$$target_service\" -p \"$$target_port\" cluster myid);
              if ! printf '%s\\n' \"$$source_nodes\" | grep -q \"^$$target_id \"; then
                echo \"Redis node $$source_service does not recognize expected peer $$target_service; refusing to merge unrelated cluster state.\" >&2;
                exit 1;
              fi;
            fi;
          done;
        done;
        for node in 'redis-1 7000' 'redis-2 7001' 'redis-3 7002'; do
          set -- $$node;
          source_service=$$1;
          source_port=$$2;
          for peer in 'redis-1 7000' 'redis-2 7001' 'redis-3 7002'; do
            set -- $$peer;
            target_service=$$1;
            target_port=$$2;
            if [ \"$$target_service\" != \"$$source_service\" ]; then
              target_ip=$$(getent hosts \"$$target_service\" | awk 'NR == 1 { print $$1; exit }');
              if [ -z \"$$target_ip\" ]; then
                echo \"Could not resolve Redis peer $$target_service; refusing to change cluster state.\" >&2;
                exit 1;
              fi;
              redis-cli -h \"$$source_service\" -p \"$$source_port\" cluster meet \"$$target_ip\" \"$$target_port\";
            fi;
          done;
        done;
      fi;
      state=fail;
      attempt=0;
      while [ \"$$attempt\" -lt 60 ]; do
        all_ok=1;
        for node in 'redis-1 7000' 'redis-2 7001' 'redis-3 7002'; do
          set -- $$node;
          state=$$(redis-cli -h \"$$1\" -p \"$$2\" cluster info | sed -n 's/^cluster_state://p' | tr -d '\\r');
          if [ \"$$state\" != 'ok' ]; then all_ok=0; fi;
        done;
        if [ \"$$all_ok\" = '1' ]; then
          echo 'Redis Cluster is healthy; all slots are assigned.';
          exit 0;
        fi;
        sleep 1;
        attempt=$$((attempt + 1));
      done;
      echo 'Redis Cluster did not become healthy within 60 seconds; refusing to reset existing cluster data.' >&2;
      redis-cli -h redis-1 -p 7000 cluster nodes >&2;
      exit 1;
      "

  # ----------------------------------------------------------------------------
  # Elasticsearch 8 CQRS Search Offloading Engine
  # ----------------------------------------------------------------------------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: demo_elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=${ELASTICSEARCH_SECURITY_ENABLED:-false}
      - ELASTIC_PASSWORD=${ELASTICSEARCH_PASSWORD:-}
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    networks:
      - internal_net

  # ----------------------------------------------------------------------------
  # FastAPI Stateless Application Server (Gunicorn + UvicornWorker)
  # ----------------------------------------------------------------------------
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: demo_app
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-postgres}:${DB_PASSWORD:-postgrespassword}@pgbouncer:5432/${DB_NAME:-app_db}
      MIGRATION_DATABASE_URL: postgresql+asyncpg://${DB_USER:-postgres}:${DB_PASSWORD:-postgrespassword}@postgres:5432/${DB_NAME:-app_db}
      DB_HOST: pgbouncer
      DB_PORT: 5432
      REDIS_CLUSTER_NODES: ${DOCKER_REDIS_CLUSTER_NODES:-redis-1:7000,redis-2:7001,redis-3:7002}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      ELASTICSEARCH_URL: ${DOCKER_ELASTICSEARCH_URL:-http://elasticsearch:9200}
      ELASTICSEARCH_USERNAME: ${ELASTICSEARCH_USERNAME:-elastic}
      ELASTICSEARCH_PASSWORD: ${ELASTICSEARCH_PASSWORD:-elasticpassword}
      PGBOUNCER_ENABLED: "true"
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-4}
      GUNICORN_BIND: 0.0.0.0:8000
      KAFKA_ENABLED: ${KAFKA_ENABLED:-true}
      KAFKA_BOOTSTRAP_SERVERS: ${DOCKER_KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_EVENTS_TOPIC: ${KAFKA_EVENTS_TOPIC:-domain.events}
      KAFKA_CONSUMER_GROUP: ${KAFKA_CONSUMER_GROUP:-highperf-fastapi}
      OUTBOX_POLL_INTERVAL: ${OUTBOX_POLL_INTERVAL:-1.0}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-100}
      AUTO_CREATE_TABLES: ${AUTO_CREATE_TABLES:-true}
    depends_on:
      pgbouncer:
        condition: service_started
      migrate:
        condition: service_completed_successfully
      redis-cluster-init:
        condition: service_completed_successfully
      elasticsearch:
        condition: service_started
      kafka:
        condition: service_healthy
    networks:
      - internal_net

  # ----------------------------------------------------------------------------
  # Nginx Reverse Proxy (First-Line Rate Limiter & Upstream Connection Pooler)
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    container_name: demo_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - internal_net

networks:
  internal_net:
    driver: bridge

volumes:
  pgdata:
  esdata:
  kafkadata:
