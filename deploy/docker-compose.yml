version: "3.9"

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL 16 Relational Database Engine
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: demo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: app_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      PGDATA: /var/lib/postgresql/data/pgdata
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=512MB
      -c effective_cache_size=1536MB
      -c maintenance_work_mem=128MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=4MB
      -c min_wal_size=1GB
      -c max_wal_size=4GB
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal_net

  # ----------------------------------------------------------------------------
  # PgBouncer 1.21+ Transaction Pooling Layer
  # ----------------------------------------------------------------------------
  pgbouncer:
    image: edoburu/pgbouncer:v1.21.0
    container_name: demo_pgbouncer
    restart: unless-stopped
    environment:
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: app_db
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 100000
      DEFAULT_POOL_SIZE: 80
      MIN_POOL_SIZE: 10
      RESERVE_POOL_SIZE: 10
      RESERVE_POOL_TIMEOUT: 5
      SERVER_LIFETIME: 3600
      SERVER_IDLE_TIMEOUT: 600
      CLIENT_IDLE_TIMEOUT: 300
    ports:
      - "6432:5432"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal_net

  # ----------------------------------------------------------------------------
  # Redis 7 Cluster (3 Master Nodes across Ports 7000, 7001, 7002)
  # ----------------------------------------------------------------------------
  redis-1:
    image: redis:7-alpine
    container_name: demo_redis_1
    restart: unless-stopped
    command: ["redis-server", "--port", "7000", "--cluster-enabled", "yes", "--cluster-config-file", "nodes.conf", "--cluster-node-timeout", "5000", "--appendonly", "yes", "--protected-mode", "no"]
    networks:
      - internal_net

  redis-2:
    image: redis:7-alpine
    container_name: demo_redis_2
    restart: unless-stopped
    command: ["redis-server", "--port", "7001", "--cluster-enabled", "yes", "--cluster-config-file", "nodes.conf", "--cluster-node-timeout", "5000", "--appendonly", "yes", "--protected-mode", "no"]
    networks:
      - internal_net

  redis-3:
    image: redis:7-alpine
    container_name: demo_redis_3
    restart: unless-stopped
    command: ["redis-server", "--port", "7002", "--cluster-enabled", "yes", "--cluster-config-file", "nodes.conf", "--cluster-node-timeout", "5000", "--appendonly", "yes", "--protected-mode", "no"]
    networks:
      - internal_net

  redis-cluster-init:
    image: redis:7-alpine
    container_name: demo_redis_cluster_init
    depends_on:
      - redis-1
      - redis-2
      - redis-3
    networks:
      - internal_net
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      echo 'yes' | redis-cli --cluster create redis-1:7000 redis-2:7001 redis-3:7002 --cluster-replicas 0;
      exit 0;
      "

  # ----------------------------------------------------------------------------
  # Elasticsearch 8 CQRS Search Offloading Engine
  # ----------------------------------------------------------------------------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: demo_elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    networks:
      - internal_net

  # ----------------------------------------------------------------------------
  # FastAPI Stateless Application Server (Gunicorn + UvicornWorker)
  # ----------------------------------------------------------------------------
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: demo_app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@pgbouncer:5432/app_db
      REDIS_CLUSTER_NODES: redis-1:7000,redis-2:7001,redis-3:7002
      ELASTICSEARCH_URL: http://elasticsearch:9200
      PGBOUNCER_ENABLED: "true"
      WEB_CONCURRENCY: 4
      GUNICORN_BIND: 0.0.0.0:8000
    depends_on:
      - pgbouncer
      - redis-cluster-init
      - elasticsearch
    networks:
      - internal_net

  # ----------------------------------------------------------------------------
  # Nginx Reverse Proxy (First-Line Rate Limiter & Upstream Connection Pooler)
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    container_name: demo_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - internal_net

networks:
  internal_net:
    driver: bridge

volumes:
  pgdata:
  esdata:
