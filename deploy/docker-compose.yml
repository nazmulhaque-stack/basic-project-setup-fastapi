services:
  # ----------------------------------------------------------------------------
  # PostgreSQL 16 Relational Database Engine
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: demo_postgres
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      POSTGRES_DB: ${DB_NAME:-app_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgrespassword}
      PGDATA: /var/lib/postgresql/data/pgdata
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=512MB
      -c effective_cache_size=1536MB
      -c maintenance_work_mem=128MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=4MB
      -c min_wal_size=1GB
      -c max_wal_size=4GB
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-app_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - internal_net

  # ----------------------------------------------------------------------------
  # PgBouncer 1.21+ Transaction Pooling Layer
  # ----------------------------------------------------------------------------
  pgbouncer:
    image: edoburu/pgbouncer:1.21.0-p2
    container_name: demo_pgbouncer
    restart: unless-stopped
    environment:
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgrespassword}
      AUTH_TYPE: scram-sha-256
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-app_db}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 100000
      DEFAULT_POOL_SIZE: 80
      MIN_POOL_SIZE: 10
      RESERVE_POOL_SIZE: 10
      RESERVE_POOL_TIMEOUT: 5
      SERVER_LIFETIME: 3600
      SERVER_IDLE_TIMEOUT: 600
      CLIENT_IDLE_TIMEOUT: 300
    ports:
      - "${PGBOUNCER_PORT:-6432}:5432"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal_net

  # ----------------------------------------------------------------------------
  # PgBouncer Exporter — Prometheus metrics for the connection pool
  # ----------------------------------------------------------------------------
  pgbouncer-exporter:
    image: prometheuscommunity/pgbouncer-exporter:latest
    container_name: demo_pgbouncer_exporter
    restart: unless-stopped
    environment:
      PGBOUNCER_EXPORTER_CONNECTION_STRING: "postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgrespassword}@pgbouncer:5432/pgbouncer?sslmode=disable"
    depends_on:
      pgbouncer:
        condition: service_healthy
    networks:
      - internal_net

  # ----------------------------------------------------------------------------
  # Apache Kafka single-node KRaft broker (local development)
  # ----------------------------------------------------------------------------
  kafka:
    image: apache/kafka:3.9.1
    container_name: demo_kafka
    restart: unless-stopped
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    volumes:
      - kafkadata:/var/lib/kafka/data
    networks:
      - internal_net

  # ----------------------------------------------------------------------------
  # Redis 7 — single standalone instance (no cluster)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: demo_redis
    restart: unless-stopped
    command: ["redis-server", "--port", "6379", "--requirepass", "${REDIS_PASSWORD:-}", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-}", "--no-auth-warning", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15
    networks:
      - internal_net

  # ----------------------------------------------------------------------------
  # Redis Exporter — Prometheus metrics
  # ----------------------------------------------------------------------------
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: demo_redis_exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: "redis://redis:6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - internal_net

  # ----------------------------------------------------------------------------
  # Elasticsearch 8 CQRS Search Offloading Engine
  # ----------------------------------------------------------------------------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: demo_elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=${ELASTICSEARCH_SECURITY_ENABLED:-false}
      - ELASTIC_PASSWORD=${ELASTICSEARCH_PASSWORD:-}
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - esdata:/usr/share/elasticsearch/data
    networks:
      - internal_net

  # ----------------------------------------------------------------------------
  # Elasticsearch Exporter — Prometheus metrics for the search cluster
  # ----------------------------------------------------------------------------
  elasticsearch-exporter:
    image: prometheuscommunity/elasticsearch-exporter:latest
    container_name: demo_elasticsearch_exporter
    restart: unless-stopped
    command: ["--es.uri=http://elasticsearch:9200"]
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - internal_net

  # ----------------------------------------------------------------------------
  # Kibana — Elasticsearch web UI (log/search exploration)
  # ----------------------------------------------------------------------------
  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.0
    container_name: demo_kibana
    restart: unless-stopped
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "${KIBANA_PORT:-5601}:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - internal_net

  # ----------------------------------------------------------------------------
  # FastAPI Stateless Application Server (Gunicorn + UvicornWorker)
  # ----------------------------------------------------------------------------
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: demo_app
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgrespassword}@pgbouncer:5432/${DB_NAME:-app_db}
      DB_HOST: pgbouncer
      DB_PORT: 5432
      REDIS_URL: redis://default:${REDIS_PASSWORD:-}@redis:6379/0
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      ELASTICSEARCH_URL: ${DOCKER_ELASTICSEARCH_URL:-http://elasticsearch:9200}
      ELASTICSEARCH_USERNAME: ${ELASTICSEARCH_USERNAME:-elastic}
      ELASTICSEARCH_PASSWORD: ${ELASTICSEARCH_PASSWORD:-elasticpassword}
      PGBOUNCER_ENABLED: "true"
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-4}
      GUNICORN_BIND: 0.0.0.0:8000
      KAFKA_ENABLED: ${KAFKA_ENABLED:-true}
      KAFKA_BOOTSTRAP_SERVERS: ${DOCKER_KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_EVENTS_TOPIC: ${KAFKA_EVENTS_TOPIC:-domain.events}
      KAFKA_CONSUMER_GROUP: ${KAFKA_CONSUMER_GROUP:-highperf-fastapi}
      OUTBOX_POLL_INTERVAL: ${OUTBOX_POLL_INTERVAL:-1.0}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-100}
      ES_SYNC_POLL_INTERVAL: ${ES_SYNC_POLL_INTERVAL:-1.0}
      ES_SYNC_BATCH_SIZE: ${ES_SYNC_BATCH_SIZE:-100}
      ES_SYNC_MAX_ATTEMPTS: ${ES_SYNC_MAX_ATTEMPTS:-10}
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_started
    networks:
      - internal_net

  # ----------------------------------------------------------------------------
  # Nginx Reverse Proxy (First-Line Rate Limiter & Upstream Connection Pooler)
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    container_name: demo_nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - internal_net

  # ----------------------------------------------------------------------------
  # Prometheus — scrapes app/pgbouncer/redis/elasticsearch exporters
  # ----------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: demo_prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - app
    networks:
      - internal_net

  # ----------------------------------------------------------------------------
  # Grafana — dashboards over the Prometheus metrics above
  # ----------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: demo_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - internal_net

networks:
  internal_net:
    driver: bridge

volumes:
  pgdata:
  esdata:
  kafkadata:
  redisdata:
  prometheus_data:
  grafana_data:
