# Production Nginx Reverse Proxy Configuration for 100k Concurrent Connections

user nginx;
worker_processes auto;
worker_rlimit_nofile 1048576; # Sized for massive open file descriptor capacity

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 65535; # Allows up to 65k concurrent connections per Nginx worker
    use epoll;                # Linux scalable I/O event notification
    multi_accept on;          # Accept as many connections as possible per event
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance Tuning
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # Keepalive to Clients
    keepalive_timeout 60s;
    keepalive_requests 100000;

    # Buffer Optimizations
    client_body_buffer_size 128k;
    client_max_body_size 10m;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 16k;

    # Logging Format with Latency Tracking
    log_format main_timed '$remote_addr - $remote_user [$time_local] "$request" '
                          '$status $body_bytes_sent "$http_referer" '
                          '"$http_user_agent" "$http_x_forwarded_for" '
                          'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main_timed;

    # Upstream Backend Pool (Gunicorn / Uvicorn processes)
    upstream app_backend {
        server app:8000;
        # Crucial: Keep pooled TCP connections alive to upstream FastAPI workers
        # Eliminates TCP 3-way handshake overhead per HTTP request
        keepalive 128;
    }

    # First-Line DDoS & Rate Limiting Zones (L4/L7 Defense)
    # Zone 1: Request rate limiting per IP (100 requests/sec with burst buffer)
    limit_req_zone $binary_remote_addr zone=req_limit_per_ip:20m rate=100r/s;
    
    # Zone 2: Concurrent TCP connection limit per IP (prevents connection exhaustion)
    limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:20m;

    server {
        listen 80 backlog=65535;
        server_name _;

        # Enforce connection limit per client IP
        limit_conn conn_limit_per_ip 100;

        # Health checks bypass rate limiting for instantaneous load-balancer probes
        location ~ ^/(healthz|readyz) {
            proxy_pass http://app_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
        }

        # Main API Proxy
        location / {
            # First-line rate limit: allow burst of 50 with nodelay for bursty API traffic
            limit_req zone=req_limit_per_ip burst=50 nodelay;
            limit_req_status 429;

            proxy_pass http://app_backend;

            # HTTP 1.1 + empty Connection header required for upstream keepalive reuse
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Forward Client Identity Headers for trusted reverse proxy parsing
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Pass request ID if present
            proxy_set_header X-Request-ID $http_x_request_id;

            # Timeouts
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

            # Buffering settings
            proxy_buffering on;
            proxy_buffer_size 8k;
            proxy_buffers 8 64k;
            proxy_busy_buffers_size 128k;
        }
    }
}
